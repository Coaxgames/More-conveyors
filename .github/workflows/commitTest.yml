name: Build Mod

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Validate mod content
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path(".")
          files = list((root / "content").rglob("*.json"))
          files.append(root / "mod.json")
          blocks = {}

          for path in files:
              data = json.loads(path.read_text(encoding="utf-8"))
              if path.parent != root:
                  blocks[path.stem] = data

          expected_research = {
              "conveyor-15-armored-thorium-conveyor": "conveyor-01-armored-titanium-conveyor",
              "distribution-armored-router": "distribution-titanium-router",
              "distribution-armored-bridge-conveyor_v2": "distribution-titanium-bridge-conveyor",
              "distribution-armored-junction": "distribution-titanium-junction",
              "liquid-5-thorium-pump": "liquid-5-titanium-pump",
              "liquid-10-thorium-conduit": "liquid-10-titanium-conduit",
              "liquid-15-armored-thorium-conduit": "liquid-15-armored-titanium-conduit",
              "power-10-thorium-battery": "power-10-titanium-battery",
              "power-15-thorium-battery-large": "power-15-titanium-battery-large",
              "storage-05-thorium-container": "storage-05-titanium-container",
              "storage-10-thorium-vault": "storage-10-titanium-vault",
              "storage-20-thorium-unloader": "storage-20-titanium-unloader",
          }
          for block, parent in expected_research.items():
              if blocks.get(block, {}).get("research") != parent:
                  raise SystemExit(f"{block}: expected research parent {parent}")

          for block in ("distribution-titanium-router", "distribution-titanium-junction"):
              data = blocks.get(block, {})
              if abs(data.get("speed", 0) - 60 / 22) > 0.001:
                  raise SystemExit(f"{block}: rate is not 22 items/second")
              if block.endswith("junction") and data.get("displayedSpeed") != 22:
                  raise SystemExit(f"{block}: displayed rate is not 22 items/second")

          print(f"Validated {len(files)} JSON files.")
          PY

      - name: Package mod
        env:
          MOD_NAME: ${{ github.event.repository.name }}
        run: |
          mkdir -p build/libs
          zip -qr "build/libs/${MOD_NAME}.jar" mod.json icon.png content sprites

      - name: Upload built mod
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: ${{ github.event.repository.name }}-${{ github.sha }}
          path: build/libs/${{ github.event.repository.name }}.jar
          if-no-files-found: error

name: Build Mod

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mindustry-version: [v157, v160]

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate mod content
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path(".")
          files = list((root / "content").rglob("*.json"))
          metadata_path = root / "mod.json"
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          if metadata.get("java") is not True or metadata.get("main") != "moreconveyors.Main":
              raise SystemExit("mod.json must declare the Java entry point moreconveyors.Main")
          files.append(metadata_path)
          blocks = {}

          for path in files:
              data = json.loads(path.read_text(encoding="utf-8"))
              if path.parent != root:
                  blocks[path.stem] = data

          expected_research = {
              "conveyor-15-armored-thorium-conveyor": "conveyor-01-armored-titanium-conveyor",
              "distribution-armored-router": "distribution-titanium-router",
              "distribution-armored-bridge-conveyor_v2": "distribution-titanium-bridge-conveyor",
              "distribution-armored-junction": "distribution-titanium-junction",
              "liquid-armored-liquid-junction": "liquid-titanium-junction",
              "liquid-armored-bridge-conduit": "liquid-titanium-bridge-conduit",
              "liquid-5-thorium-pump": "liquid-5-titanium-pump",
              "liquid-10-thorium-conduit": "liquid-10-titanium-conduit",
              "liquid-15-armored-thorium-conduit": "liquid-15-armored-titanium-conduit",
              "power-10-thorium-battery": "power-10-titanium-battery",
              "power-15-thorium-battery-large": "power-15-titanium-battery-large",
              "storage-05-thorium-container": "storage-05-titanium-container",
              "storage-10-thorium-vault": "storage-10-titanium-vault",
              "storage-20-thorium-unloader": "storage-20-titanium-unloader",
          }
          for block, parent in expected_research.items():
              if blocks.get(block, {}).get("research") != parent:
                  raise SystemExit(f"{block}: expected research parent {parent}")

          expected_replacements = {
              "conveyor-01-armored-titanium-conveyor": {
                  "junctionReplacement": ("distribution-titanium-junction", "Junction"),
                  "bridgeReplacement": ("distribution-titanium-bridge-conveyor", "ItemBridge"),
              },
              "conveyor-15-armored-thorium-conveyor": {
                  "junctionReplacement": ("distribution-armored-junction", "Junction"),
                  "bridgeReplacement": ("distribution-armored-bridge-conveyor_v2", "ItemBridge"),
              },
              "conveyor-35-armored-surge-alloy-conveyor": {
                  "junctionReplacement": ("distribution-armored-junction2-surge", "Junction"),
              },
              "conveyor-45-armored-composite-conveyor": {
                  "junctionReplacement": ("distribution-armored-junction3-composite", "Junction"),
              },
              "liquid-10-titanium-conduit": {
                  "junctionReplacement": ("liquid-titanium-junction", "LiquidJunction"),
                  "bridgeReplacement": ("liquid-titanium-bridge-conduit", "LiquidBridge"),
                  "rotBridgeReplacement": ("liquid-titanium-bridge-conduit", "LiquidBridge"),
              },
              "liquid-15-armored-titanium-conduit": {
                  "junctionReplacement": ("liquid-titanium-junction", "LiquidJunction"),
                  "bridgeReplacement": ("liquid-titanium-bridge-conduit", "LiquidBridge"),
                  "rotBridgeReplacement": ("liquid-titanium-bridge-conduit", "LiquidBridge"),
              },
              "liquid-10-thorium-conduit": {
                  "junctionReplacement": ("liquid-armored-liquid-junction", "LiquidJunction"),
                  "bridgeReplacement": ("liquid-armored-bridge-conduit", "LiquidBridge"),
                  "rotBridgeReplacement": ("liquid-armored-bridge-conduit", "LiquidBridge"),
              },
              "liquid-15-armored-thorium-conduit": {
                  "junctionReplacement": ("liquid-armored-liquid-junction", "LiquidJunction"),
                  "bridgeReplacement": ("liquid-armored-bridge-conduit", "LiquidBridge"),
                  "rotBridgeReplacement": ("liquid-armored-bridge-conduit", "LiquidBridge"),
              },
          }
          for block, replacements in expected_replacements.items():
              for property_name, (replacement, expected_type) in replacements.items():
                  if blocks.get(block, {}).get(property_name) != replacement:
                      raise SystemExit(f"{block}: expected {property_name}={replacement}")
                  if blocks.get(replacement, {}).get("type") != expected_type:
                      raise SystemExit(f"{replacement}: expected block type {expected_type}")

          for block in ("distribution-titanium-router", "distribution-titanium-junction"):
              data = blocks.get(block, {})
              if abs(data.get("speed", 0) - 60 / 22) > 0.001:
                  raise SystemExit(f"{block}: rate is not 22 items/second")
              if block.endswith("junction") and data.get("displayedSpeed") != 22:
                  raise SystemExit(f"{block}: displayed rate is not 22 items/second")

          print(f"Validated {len(files)} JSON files.")
          PY

      - name: Build mod JAR
        run: gradle --no-daemon build -PmindustryVersion=${{ matrix.mindustry-version }} --stacktrace --console=plain

      - name: Upload built mod
        if: matrix.mindustry-version == 'v157'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: ${{ github.event.repository.name }}-${{ github.sha }}
          path: build/libs/More-conveyors.jar
          if-no-files-found: error
